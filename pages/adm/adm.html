<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>adm/bolsa acadêmica</title>

</head>
<body>
    
    <h3>Veja os aprovados à bolsa academica</h3>
    
    <form>
        
        <div class="caixa-login">
            <label for="login">Login</label>
            <input 
                type="text"
                id="login"
            >
        </div>
            
        <div class="caixa-senha">

            <label for="senha">Senha</label>
            <input 
                type="password"
                id="senha"
            >
        </div>

        <button
            type="submit"
        >
            Cadastrar
        </button>

        <button
            type="button"
            id="entrar"
        >
             Entrar 
        </button>

        <div id="caixa-mensagem">
            <span id="mensagem"></span>
        </div>

    </form>
   

    <script src="script.js"></script>
</body>
</html>
